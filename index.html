<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>La Iguana - Escáner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f7f7f7;
    }

    h1 {
      margin-bottom: 5px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
    }

    #resultado {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      font-size: 20px;
    }

    .codigo {
      font-size: 28px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🦎 La Iguana Handmade</h1>

  <p>Escanea un producto</p>

  <div id="reader"></div>

  <div id="resultado">
    Esperando escaneo...
  </div>

  <script>

    function escaneoExitoso(codigo) {

      document.getElementById("resultado").innerHTML =
        "<div>✅ CÓDIGO LEÍDO</div>" +
        "<div class='codigo'>" + codigo + "</div>";

      console.log("Código leído:", codigo);
    }

    function errorEscaneo(error) {
      // Ignoramos errores normales mientras busca un QR
    }

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );

    scanner.render(
      escaneoExitoso,
      errorEscaneo
    );

  </script>

</body>
</html>
