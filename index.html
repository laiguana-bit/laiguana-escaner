<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>La Iguana - Escáner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f7f7f7;
    }

    h1 {
      margin-bottom: 5px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
    }

    #resultado {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      font-size: 20px;
    }

    .codigo {
      font-size: 28px;
      font-weight: bold;
    }

    .producto {
      font-size: 28px;
      font-weight: bold;
      margin: 10px 0;
    }

    .precio {
      font-size: 24px;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🦎 La Iguana Handmade</h1>

  <p>Escanea un producto</p>

  <div id="reader"></div>

  <div id="resultado">
    Esperando escaneo...
  </div>

  <script>

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbwSOib7-PmhWK2_1OzvsvOM05CGLCTaTyuRlvTyh-eUG1bUksRPt-6ou5aZo0xjO-tNzQ/exec";

    let procesando = false;

    function registrarEnInventario(codigo) {

      if (procesando) return;

      procesando = true;

      document.getElementById("resultado").innerHTML =
        "⏳ Registrando venta...";

     const callback = "pruebaConexion_" + Date.now();

      window[callback] = function(data) {

        if (data.ok) {

          document.getElementById("resultado").innerHTML = `
            <div>✅ VENTA REGISTRADA</div>

            <div class="producto">
              ${data.producto}
            </div>

            <div class="precio">
              $${Number(data.precio).toLocaleString('es-CO')}
            </div>

            <div>
              Stock restante:
              <strong>${data.stock}</strong>
            </div>
          `;

        } else {

          document.getElementById("resultado").innerHTML = `
            <div class="error">⚠️ ${data.mensaje}</div>
            <div>${data.codigo || ''}</div>
          `;

        }

        setTimeout(function() {
          procesando = false;
        }, 1500);
      };

      const script = document.createElement("script");

      script.src =
        URL_APPS_SCRIPT +
        "?codigo=" + encodeURIComponent(codigo) +
        "&callback=" + callback +
        "&t=" + Date.now();

      document.body.appendChild(script);
    }


    function escaneoExitoso(codigo) {

      registrarEnInventario(codigo);

    }


    function errorEscaneo(error) {
      // Ignoramos los errores normales mientras busca un QR
    }


    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );


    scanner.render(
      escaneoExitoso,
      errorEscaneo
    );

  </script>

</body>
</html>
