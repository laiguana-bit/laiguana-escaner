<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>La Iguana - Escáner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {

      background: white;
      border-radius: 12px;
      font-size: 20px;
    }
  </style>

</head>

<body>

  <h1>🦎 La Iguana Handmade</h1>

  <p>Escanea un producto</p>

  <!-- CANAL -->

<!-- CANAL -->

<label for="canal"><strong>Canal:</strong></label>

<select
  id="canal"
  style="
    width:100%;
    padding:12px;
    font-size:18px;
    margin:10px 0;
    border-radius:8px;
  "
>
  <option value="">Selecciona un canal</option>
  <option value="Coventalia">Coventalia</option>
  <option value="SOFA">SOFA</option>
  <option value="Comic-Con">Comic-Con</option>
  <option value="Lupicon">Lupicon</option>
</select>

<div style="
  display:flex;
  gap:8px;
  margin-bottom:15px;
">

  <input
    id="nuevoCanal"
    type="text"
    placeholder="Nuevo canal"
    style="
      flex:1;
      padding:12px;
      font-size:16px;
      border-radius:8px;

    "
  >

  <button
    onclick="agregarCanal()"
    style="
      padding:12px 15px;

      border-radius:8px;
      border:1px solid #ccc;

    "
  >

</div>
  <!-- VENDEDOR -->

<label for="vendedor"><strong>Vendedor:</strong></label>

<select

width:100%;

"

>

  </select>

  <div id="reader"></div>

  <div id="resultado">
    Esperando escaneo...
  </div>

<button
onclick="probarConexion()"
style="
margin:20px;
padding:15px 25px;
font-size:18px;
border-radius:10px;
border:1px solid #ccc;
background:white;
"

>

```
🔌 Probar conexión
```

  </button>

  <script>

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbz21UnMnNhHmxBUhIE7CCgeq8mbar4IqpurWxuRh3AtbFbr5J4q4Y-KrMQMIo9Ey5rGNg/exec";


    /* =========================
       CONEXIÓN DE PRUEBA
       ========================= */

    function probarConexion() {

      document.getElementById("resultado").innerHTML =
        "⏳ Probando conexión...";

      const callback = "pruebaConexion_" + Date.now();

      window[callback] = function(data) {

        document.getElementById("resultado").innerHTML =
          data.ok
            ? "✅ CONEXIÓN CORRECTA"
            : "⚠️ Respuesta recibida";

        delete window[callback];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      };

      const script = document.createElement("script");

      script.onerror = function() {

        document.getElementById("resultado").innerHTML =
          "❌ No se pudo recibir la respuesta";

        delete window[callback];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      };

      script.src =
        "https://script.google.com/macros/s/AKfycbz21UnMnNhHmxBUhIE7CCgeq8mbar4IqpurWxuRh3AtbFbr5J4q4Y-KrMQMIo9Ey5rGNg/exec" +
        "?prueba=1" +
        "&callback=" + callback +
        "&t=" + Date.now();

      document.body.appendChild(script);
    }


    /* =========================
       RECORDAR VENDEDOR
       ========================= */

    const vendedorGuardado =
      localStorage.getItem("vendedorLaIguana");

    if (vendedorGuardado) {
      document.getElementById("vendedor").value =
        vendedorGuardado;
    }

    document.getElementById("vendedor")
      .addEventListener("change", function() {

        localStorage.setItem(
          "vendedorLaIguana",
          this.value
        );
      });


   /* =========================
   CANALES
   ========================= */

const selectCanal =
  document.getElementById("canal");

const inputNuevoCanal =
  document.getElementById("nuevoCanal");


// Cargar canales guardados
const canalesGuardados =
  JSON.parse(
    localStorage.getItem("canalesLaIguana") || "[]"
  );


// Agregar canales guardados al selector
canalesGuardados.forEach(function(canal) {

  agregarOpcionCanal(canal);

});


// Canal empieza vacío
selectCanal.value = "";


// Guardar canal seleccionado
selectCanal.addEventListener(
  "change",
  function() {

    localStorage.setItem(
      "canalLaIguana",
      this.value
    );

  }
);


// Crear opción en el selector
function agregarOpcionCanal(canal) {

  const opcion =
    document.createElement("option");

  opcion.value = canal;
  opcion.textContent = canal;

  selectCanal.appendChild(opcion);
}


// Añadir nuevo canal
function agregarCanal() {

  const nuevo =
    inputNuevoCanal.value.trim();

  if (!nuevo) {
    return;
  }


  // Evitar duplicados
  const existe =
    Array.from(
      selectCanal.options
    ).some(function(opcion) {

      return opcion.value.toLowerCase()
        === nuevo.toLowerCase();

    });


  if (existe) {

    selectCanal.value =
      Array.from(selectCanal.options)
        .find(function(opcion) {

          return opcion.value.toLowerCase()
            === nuevo.toLowerCase();

        }).value;

    inputNuevoCanal.value = "";

    return;
  }


  // Añadir al selector
  agregarOpcionCanal(nuevo);


  // Guardar en lista permanente
  canalesGuardados.push(nuevo);

  localStorage.setItem(
    "canalesLaIguana",
    JSON.stringify(canalesGuardados)
  );


  // Seleccionarlo automáticamente
  selectCanal.value = nuevo;

  localStorage.setItem(
    "canalLaIguana",
    nuevo
  );


  inputNuevoCanal.value = "";
}


    /* =========================
       CONTROL DE ESCANEOS
       ========================= */

    let escaneoBloqueado = false;
    let ultimoCodigo = "";
    let ultimoEscaneo = 0;


    /* =========================
       REGISTRAR VENTA
       ========================= */

    function escaneoExitoso(codigo) {

      const ahora = Date.now();

      if (
        escaneoBloqueado ||
        (codigo === ultimoCodigo &&
         ahora - ultimoEscaneo < 4000)
      ) {
        return;
      }

      escaneoBloqueado = true;
      ultimoCodigo = codigo;
      ultimoEscaneo = ahora;

      document.getElementById("resultado").innerHTML =
        "⏳ Registrando venta...";

      const callback =
        "respuestaVenta_" + Date.now();

      window[callback] = function(data) {

        if (data.ok) {

          document.getElementById("resultado").innerHTML = `
            <div>✅ VENTA REGISTRADA</div>

            <div style="
              font-size:28px;
              font-weight:bold;
              margin:10px 0;
            ">
              ${data.producto}
            </div>

            <div>
              Stock restante:
              <strong>${data.stock}</strong>
            </div>
          `;

        } else {

          document.getElementById("resultado").innerHTML = `
            <div style="
              color:#b00020;
              font-weight:bold;
            ">
              ⚠️ ${data.mensaje}
            </div>

            <div>
              ${data.codigo || ''}
            </div>
          `;
        }

        delete window[callback];

        setTimeout(() => {
          escaneoBloqueado = false;
        }, 4000);

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      };


      const script = document.createElement("script");


      script.onerror = function() {

        document.getElementById("resultado").innerHTML = `
          <div style="
            color:#b00020;
            font-weight:bold;
          ">
            ⚠️ No se pudo conectar con el inventario
          </div>
        `;

        delete window[callback];

        setTimeout(() => {
          escaneoBloqueado = false;
        }, 4000);

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      };


      const vendedor =
        document.getElementById("vendedor").value;

      const canal =
        document.getElementById("canal").value;


      localStorage.setItem(
        "vendedorLaIguana",
        vendedor
      );

      localStorage.setItem(
        "canalLaIguana",
        canal
      );


      script.src =
        URL_APPS_SCRIPT +
        "?codigo=" + encodeURIComponent(codigo) +
        "&vendedor=" + encodeURIComponent(vendedor) +
        "&canal=" + encodeURIComponent(canal) +
        "&callback=" + callback +
        "&t=" + Date.now();


      document.body.appendChild(script);
    }


    /* =========================
       ERRORES NORMALES DEL ESCÁNER
       ========================= */

    function errorEscaneo(error) {
      // Ignoramos los errores normales mientras busca un QR
    }


    /* =========================
       ESCÁNER QR
       ========================= */

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );


    scanner.render(
      escaneoExitoso,
      errorEscaneo
    );

  </script>

</body>
</html>
