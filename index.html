<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>La Iguana - Escáner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f7f7f7;
    }

    h1 {
      margin-bottom: 5px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
    }

    #resultado {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <h1>🦎 La Iguana Handmade</h1>

  <p>Escanea un producto</p>

  <div id="reader"></div>

 <div id="resultado">
  Esperando escaneo...
</div>

<button
  onclick="probarConexion()"
  style="
    margin:20px;
    padding:15px 25px;
    font-size:18px;
    border-radius:10px;
    border:1px solid #ccc;
    background:white;
  "
>
  🔌 Probar conexión
</button>

  <script>

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbwSOib7-PmhWK2_1OzvsvOM05CGLCTaTyuRlvTyh-eUG1bUksRPt-6ou5aZo0xjO-tNzQ/exec";

function probarConexion() {

  document.getElementById("resultado").innerHTML =
    "⏳ Probando conexión...";

  const callback = "pruebaConexion_" + Date.now();

  window[callback] = function(data) {

    document.getElementById("resultado").innerHTML =
      data.ok
        ? "✅ CONEXIÓN CORRECTA"
        : "⚠️ Respuesta recibida";

    delete window[callback];

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }
  };

  const script = document.createElement("script");

  script.onerror = function() {

    document.getElementById("resultado").innerHTML =
      "❌ No se pudo recibir la respuesta";

    delete window[callback];

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }
  };

  script.src =
    "https://script.google.com/macros/s/AKfycbwSOib7-PmhWK2_1OzvsvOM05CGLCTaTyuRlvTyh-eUG1bUksRPt-6ou5aZo0xjO-tNzQ/exec" +
    "?prueba=1" +
    "&callback=" + callback +
    "&t=" + Date.now();

  document.body.appendChild(script);
}
    function escaneoExitoso(codigo) {

      document.getElementById("resultado").innerHTML =
        "⏳ Registrando venta...";

      const callback = "respuestaVenta_" + Date.now();

      window[callback] = function(data) {

        if (data.ok) {

          document.getElementById("resultado").innerHTML = `
            <div>✅ VENTA REGISTRADA</div>

            <div style="
              font-size:28px;
              font-weight:bold;
              margin:10px 0;
            ">
              ${data.producto}
            </div>

            <div style="font-size:24px;">
              $${Number(data.precio).toLocaleString('es-CO')}
            </div>

            <div>
              Stock restante:
              <strong>${data.stock}</strong>
            </div>
          `;

        } else {

          document.getElementById("resultado").innerHTML = `
            <div style="
              color:#b00020;
              font-weight:bold;
            ">
              ⚠️ ${data.mensaje}
            </div>

            <div>
              ${data.codigo || ''}
            </div>
          `;
        }

        delete window[callback];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      };


      const script = document.createElement("script");


      script.onerror = function() {

        document.getElementById("resultado").innerHTML = `
          <div style="
            color:#b00020;
            font-weight:bold;
          ">
            ⚠️ No se pudo conectar con el inventario
          </div>
        `;

        delete window[callback];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      };


      script.src =
        URL_APPS_SCRIPT +
        "?codigo=" + encodeURIComponent(codigo) +
        "&callback=" + callback +
        "&t=" + Date.now();


      document.body.appendChild(script);
    }


    function errorEscaneo(error) {
      // Ignoramos los errores normales mientras busca un QR
    }


    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );


    scanner.render(
      escaneoExitoso,
      errorEscaneo
    );

  </script>

</body>
</html>
